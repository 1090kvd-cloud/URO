    <circle r="52" fill="none" stroke="#fff0ba" stroke-width="2"/>
    <circle r="27" fill="#ffe7a1" stroke="#9d621a" stroke-width="3"/>
    <g stroke="#b9ada0" stroke-width="2"><path d="M0-160V-150M0 150V160M-160 0H-150M150 0H160M-113-113L-106-106M113 113L106 106M113-113L106-106M-113 113L-106 106"/></g>
