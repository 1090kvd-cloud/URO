<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Уровень — инструмент для Android от KVD</title>
  <desc id="desc">Графитовая обложка с оранжевой иллюстрацией пузырькового уровня. Иллюстрация, не снимок интерфейса.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#191410"/><stop offset="1" stop-color="#070709"/></linearGradient>
    <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#ffd264"/><stop offset="1" stop-color="#ef7d0f"/></linearGradient>
    <radialGradient id="glass"><stop stop-color="#ffd264"/><stop offset=".75" stop-color="#d87812"/><stop offset="1" stop-color="#4d2607"/></radialGradient>
  </defs>
  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <path d="M0 485H1280" stroke="#ffa52c" stroke-opacity=".22"/>
  <g font-family="sans-serif">
    <text x="72" y="105" font-size="23" fill="#ffa52c" letter-spacing="5">KVD · ANDROID</text>
    <text x="68" y="226" font-size="92" font-weight="700" fill="#f4eee6">Уровень</text>
    <text x="74" y="285" font-size="29" fill="#b9ada0">Горизонталь. Вертикаль. Поворот.</text>
    <g font-size="20" fill="#e2d8c9"><text x="74" y="379">Градусные шкалы</text><text x="74" y="414">Калибровка и звуковой контроль</text></g>
    <text x="74" y="470" font-size="17" fill="#a3988c">Бесплатно · Без рекламы · Работает без интернета</text>
  </g>
  <g transform="translate(995 275)">
